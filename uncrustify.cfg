# Basic Settings
newlines = LF                 # Use Unix-style line endings (LF)
input_tab_size = 4            # Tab size for input files is 4 spaces
output_tab_size = 4           # Tab size for output files is 4 spaces
code_width = 120              # Maximum line width for code is 120 characters

# Indentation
indent_with_tabs = 1          # Use tabs for indentation instead of spaces
indent_columns = 4            # Indentation width is 4 columns
indent_class = true           # Indent content inside a class declaration
indent_namespace = true       # Indent content inside namespace declarations
indent_namespace_level = 4    # Indentation level for namespaces is 4 spaces
indent_param = output_tab_size # Use the same tab size for parameter indentation
indent_access_spec = 0        # Don't indent access specifiers (public, private, protected)
indent_access_spec_body = true # Indent the code after access specifiers
indent_align_string = false   # Don't align strings across multiple lines
indent_brace = 0              # Don't indent braces extra spaces
indent_switch_case = indent_columns # Indent 'case' one tab in from 'switch'
indent_func_def_param = true  # Indent parameters in function definitions
indent_func_param = 4         # Indent parameters by 4 spaces
indent_func_continuation = 4  # Indent function continuation lines by 4 spaces
indent_continue = 4           # Indent continuation lines by 4 spaces
indent_relative_single_line_comments = false # Don't indent single-line comments relative to code
indent_single_newlines = false # Don't indent single-newline statements
indent_func_param_double = false # Don't double-indent function parameters

# Newlines
nl_max = 0                    # No limit on consecutive blank lines
nl_after_func_body = 0        # Don't force newlines after function body
nl_after_func_proto_group = 0 # Don't force newlines after group of function prototypes
nl_before_block_comment = 0   # Don't add newlines before block comments
nl_before_case = 0            # Don't force newlines before case statements
nl_before_if = force          # Force a blank line before 'if' (not first stmt in block, not 'else if')
nl_case_colon_brace = add     # Add newline between case ':' and its opening brace
nl_after_brace_open = true    # Force the statement after '{' onto its own line (needed to split case bodies)
nl_before_access_spec = 0     # Don't force newlines before access specifiers
nl_after_access_spec = 0      # Don't add newlines after access specifiers
nl_end_of_file = force        # Force a newline at the end of file
nl_end_of_file_min = 1        # Minimum of 1 newline at end of file

# Braces
nl_assign_brace = add         # Add newline after assignment operator before opening brace
nl_enum_brace = add           # Add newline between enum and opening brace
nl_struct_brace = add         # Add newline between struct and opening brace
nl_union_brace = add          # Add newline between union and opening brace
nl_if_brace = add             # Add newline between if and opening brace
nl_for_brace = add            # Add newline between for and opening brace
nl_while_brace = add          # Add newline between while and opening brace
nl_do_brace = add             # Add newline between do and opening brace
nl_switch_brace = add         # Add newline between switch and opening brace
nl_namespace_brace = add      # Add newline between namespace and opening brace
nl_class_brace = add          # Add newline between class and opening brace
nl_fcall_brace = add          # Add newline between function call and opening brace
nl_fdef_brace = add           # Add newline between function definition and opening brace
nl_brace_else = add           # Add newline between closing brace and else
nl_else_brace = add           # Add newline between else and its opening brace
nl_elseif_brace = add         # Add newline between else if (...) and its opening brace
nl_try_brace = add            # Add newline between try and opening brace
nl_catch_brace = add          # Add newline between catch and opening brace
nl_finally_brace = add        # Add newline between finally and opening brace
nl_brace_while = remove       # Remove newline between closing brace and while in do-while

# Spacing
sp_assign = force             # Force a space around assignment operator
sp_after_comma = force        # Force a space after comma
sp_bool = force               # Force spaces around boolean operators
sp_compare = force            # Force spaces around comparison operators
sp_inside_braces = force      # Force spaces inside braces
sp_inside_braces_struct = force # Force spaces inside braces for structs
sp_inside_braces_enum = force # Force spaces inside braces for enums
sp_inside_braces_empty = force # Force spaces inside empty braces
sp_before_sparen = force      # Force a space before opening parenthesis of control statements
sp_after_sparen = force       # Force a space after closing parenthesis of control statements
sp_sparen_brace = add         # Add a space between closing parenthesis and opening brace
sp_fparen_brace = add         # Add a space between function closing parenthesis and opening brace
sp_word_brace_init_lst = force # Force a space between a variable/identifier and its brace-init-list (e.g. NAME{ 10U } -> NAME { 10U })

# Template spacing
sp_angle_shift = remove       # Remove spaces in angle bracket shifts like '>>'
sp_inside_angle = remove      # Remove spaces inside angle brackets '<>'
sp_template_angle = remove    # Remove spaces between template and angle bracket
sp_before_angle = remove      # Remove spaces before opening angle bracket
sp_after_angle = force        # Force a space after closing angle bracket
sp_angle_paren = remove       # Remove spaces between angle bracket and parenthesis
sp_angle_word = force         # Force a space between angle bracket and word
sp_angle_shift_left = remove  # Remove spaces in left shifts with angle brackets
sp_template_angle_close = remove # Remove spaces before closing template angle brackets
sp_permit_cpp11_shift = true  # Permit spaces in C++11 right shift operator
sp_after_angle_colon = force  # Force space after angle-colon in templates

# Template options
tok_split_gte = false         # Don't split '>=' operator
sp_return = force             # Force a space after return keyword

# Function spacing
sp_func_def_paren = remove    # Remove space between function name and opening parenthesis in definitions
sp_func_call_paren = remove   # Remove space between function name and opening parenthesis in calls
sp_func_proto_paren = remove  # Remove space between function name and opening parenthesis in prototypes
sp_func_class_paren = remove  # Remove space between class name and opening parenthesis

# Pointer/Reference spacing
sp_after_ptr_star = force     # Force a single space after pointer star
sp_after_ptr_star_func = force # Force a space after pointer star before a function name
sp_before_ptr_star = false    # Don't add space before pointer star
sp_between_ptr_star = remove  # Remove space between multiple pointer stars
sp_before_byref = remove      # Remove space before reference sign &

# Alignment
align_with_tabs = false       # Don't use tabs for alignment
align_on_tabstop = false      # Don't align on tabstops
align_func_params = false     # Don't align function parameters
align_var_def_span = 0        # Don't align variable definitions
align_assign_span = 0         # Don't align assignments
align_enum_equ_span = 0       # Don't align enum values
align_var_struct_span = 0     # Don't align structure variable definitions
align_struct_init_span = 0    # Don't align structure initializations
align_right_cmt_span = 0      # Don't align comments to the right
align_nl_cont = 0             # Don't align backslash-newline continuations
align_pp_define_span = 0      # Don't align macro definitions
align_continue = 0            # Don't align continued statements
align_func_params_span = 0    # Don't align function parameters across multiple lines
align_func_params_thresh = 0  # Threshold for aligning function parameters
align_mix_var_proto = false   # Don't mix aligning variable definitions and prototypes

# Other
mod_paren_on_return = remove  # Remove parentheses from return statements
mod_full_brace_if = add       # Add braces to if statements
mod_full_brace_for = add      # Add braces to for loops
mod_full_brace_do = add       # Add braces to do loops
mod_full_brace_while = add    # Add braces to while loops
mod_case_brace = add          # Add braces around each case statement's body
eat_blanks_before_close_brace = false # Keep blank lines before closing braces
eat_blanks_after_open_brace = false   # Keep blank lines after opening braces